<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <link href="loginpagecss.css" rel="stylesheet" type="text/css" />
</head>
<body>

<div class="login-container" id="login-section">
  <img src="../images/logo.png" alt="Logo" class="login-logo">
  <h1>Login</h1>
  <form id="loginForm">
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Login</button>
    <p id="error-message" class="error"></p>
    <p>Don't have an account? <a href="#" onclick="toggleForm('signup')">Sign up</a></p>
  </form>
</div>

<div class="login-container" id="signup-section" style="display:none">
  <img src="../images/logo.png" alt="Logo" class="login-logo">
  <h1>Sign Up</h1>
  <form id="signupForm">
    <input type="email" id="signupEmail" placeholder="Email" required />
    <input type="password" id="signupPassword" placeholder="Password" required />
    <button type="submit">Sign Up</button>
    <p id="signup-error-message" class="error"></p>
    <p>Already have an account? <a href="#" onclick="toggleForm('login')">Login</a></p>
  </form>
</div>

    <script src="loginpagejava.js"></script>
</body>
</html>
