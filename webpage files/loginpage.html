<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Page</title>
  <link href="loginpagecss.css" rel="stylesheet" type="text/css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
</head>
<body>
  <div class="login-container" id="login-section">
    <img src="../images/logo.png" alt="Logo" class="login-logo" />
    <h1><b>Login</h1></b>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
      <p id="error-message" class="error"></p>
    </form>
    <p>
      Don't have an account? <a href="#" onclick="toggleForm('signup')">Sign Up</a>
    </p>
    <p>
      <a href="#" onclick="toggleForm('forgot')">Forgot Password?</a>
    </p>
  </div>

  <div class="login-container" id="signup-section" style="display:none;">
    <img src="../images/logo.png" alt="Logo" class="login-logo" />
    <h1>Sign Up</h1>
    <form id="signupForm">
      <input type="email" id="signupEmail" placeholder="Email" required />
      <input type="password" id="signupPassword" placeholder="Password" required />
      <button type="submit">Sign Up</button>
      <p id="signup-error-message" class="error"></p>
    </form>
    <p>
      Already have an account? <a href="#" onclick="toggleForm('login')">Login</a>
    </p>
  </div>

  <div class="login-container" id="forgot-section" style="display:none;">
    <img src="../images/logo.png" alt="Logo" class="login-logo" />
    <h1>Reset Password</h1>
    <form id="forgotForm">
      <input type="email" id="forgotEmail" placeholder="Enter your email" required />
      <button type="submit">Send Reset Link</button>
      <p id="forgot-error-message" class="error"></p>
    </form>
    <form id="resetForm" style="display:none;">
      <input type="password" id="newPassword" placeholder="New password" required />
      <button type="submit">Reset Password</button>
      <p id="reset-error-message" class="error"></p>
    </form>
    <p>
      Remembered? <a href="#" onclick="toggleForm('login')">Login</a>
    </p>
  </div>

  <a href="studenthomepage.html" id="educationLink" style="display: none"></a>
  <a href="adminhomepage.html" id="adminLink" style="display: none"></a>

  <script src="loginpagejava.js"></script>
</body>
</html>
