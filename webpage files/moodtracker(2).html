<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Dashboard</title>
  <link rel="icon" type="image/x-icon" href="..//images/logo.png">
  <link rel="stylesheet" href="moodtracker(2).css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<!--Navigation Bar-->
  <div class="navbar">
    <div class="logo">
    <img src="../images/logo.png" alt="Logo" class="logo">
  </div>
    <ul id="navLinks">
      <li><a href="adminhomepage.html">Home</a></li>
      <li><a href="moodtracker(2).html">Mood Tracker</a></li>
        <li><a href="productivitydashboard.html">Dashboard</a></li>
      <li><a href="loginpage.html">Sign Out</a></li>
    </ul>
  </div>

<div class="main-container">
    <div class="tracker-wrapper">

<!--heatmap grid-->  
<!-- Mood display box (replaces heatmap) -->
<div class="heatmap-container">
  <h2 class="wavy-text">mood tracker</h2>
  
  <div id="mood-box" class="mood-display-box"></div>
  <p id="mood-caption" class="mood-caption">You haven't logged your mood yet.</p>
</div>



<!--mood input form-->  

  <div class="form-container">
    <select id="mood-select">
      <option value="" disabled selected hidden> select your mood</option>
      <option value="happy"> 🟨 Happy</option>
      <option value="sad"> 🟦 Sad</option>
      <option value="angry"> 🟥 Angry</option>
      <option value="anxious"> 🟧 Anxious</option>
      <option value="calm"> 🟩 Calm</option>
    </select>

    <textarea id="mood-note" placeholder="talk about your day (optional)"></textarea>

    <button class="button-primary"onclick="logMood()">log</button>
  </div>

</div>
</div>
<footer class="dashboard-footer">
  <p>© 2023 MacWell Hub - Mood Tracker</p>
  <div class="footer-links">
    <i class="fab fa-facebook"></i>
    <i class="fab fa-twitter"></i>
    <i class="fab fa-instagram"></i>
  </div>
</footer>

<script src="moodtracker(2).js"></script>

</body>
</html>
